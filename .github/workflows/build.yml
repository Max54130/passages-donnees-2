name: Construire les horaires

# Reconstruit les horaires de tous les réseaux du dépôt à partir des données ouvertes
# (transport.data.gouv.fr), puis les publie avec GitHub Pages pour l'appli Prochains passages.
on:
  schedule:
    - cron: "17 2 1,15 * *"   # le 1er et le 15 de chaque mois, vers 3 h 17 (heure de Paris en hiver)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger et construire les horaires
        run: python3 build/ci.py
        env:
          MAX_MIN: "300"
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Une petite trace datée garde le dépôt actif : GitHub suspend les tâches programmées
      # des dépôts publics restés 60 jours sans activité.
      - name: Noter la date de construction
        run: |
          date -u +"%Y-%m-%dT%H:%MZ" > build/derniere-construction.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add build/derniere-construction.txt
          git commit -m "Construction des horaires du $(date -u +%Y-%m-%d)" || true
          git push || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
